[package]
name = "gitpane"
version = "0.10.2"
edition = "2024"
rust-version = "1.88.0"
description = "Multi-repo Git workspace dashboard TUI"
license = "MIT"
repository = "https://github.com/affromero/gitpane"
homepage = "https://github.com/affromero/gitpane"
readme = "README.md"
keywords = ["git", "tui", "dashboard", "multi-repo", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--deny", "warnings"]

[dependencies]
ratatui = { version = "0.30", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
tokio = { version = "1.23.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
strum = { version = "0.28", features = ["derive"] }
directories = "6"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
git2 = { version = "0.21", features = ["vendored-openssl"] }
walkdir = "2"
ignore = "0.4"
dirs = "6"
notify = "8"
notify-debouncer-full = "0.7"
ureq = "3"
serde_json = "1"
wait-timeout = "0.2.1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"
